<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Глобус перелетов</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link href='styles.css' rel='stylesheet' />
</head>
<body>

<div id="map"></div>

<div id="stats-panel">
    <div id="my-session-section" class="my-session-section" style="display: none;">
        <button id="my-session-btn" class="my-session-btn" onclick="openMySession()">🏠 Моя карта</button>
    </div>
    
    <div class="add-flight-section">
        <div class="button-group">
            <button id="toggle-form-btn" class="toggle-form-btn" onclick="toggleAddFlightForm()">➕ Добавить</button>
            <button id="toggle-import-btn" class="toggle-import-btn" onclick="toggleImportForm()" title="Массовый импорт">📤</button>
            <button id="download-btn" class="toggle-import-btn" onclick="downloadCSV()" title="Скачать маршруты">💾</button>
            <button id="share-btn" class="share-btn" onclick="shareMap()" title="Поделиться картой">🔗</button>
        </div>
        <div id="add-flight-form" class="add-flight-form" style="display: none;">
            <h3>Добавить новый перелет</h3>
            <form id="flight-form" onsubmit="addFlight(event)">
                <div class="form-row">
                    <label for="flight-number">Рейс (необязательно):</label>
                    <input type="text" id="flight-number" placeholder="SU 123">
                </div>
                <div class="form-row">
                    <label for="airline">Авиалиния (необязательно):</label>
                    <input type="text" id="airline" placeholder="Aeroflot">
                </div>
                <div class="form-row">
                    <label for="from-airport">Аэропорт вылета*:</label>
                    <input type="text" id="from-airport" placeholder="SVO" required maxlength="3" pattern="[A-Za-z]{3}">
                </div>
                <div class="form-row">
                    <label for="to-airport">Аэропорт прилета*:</label>
                    <input type="text" id="to-airport" placeholder="LED" required maxlength="3" pattern="[A-Za-z]{3}">
                </div>
                <div class="form-row">
                    <label for="flight-date">Дата*:</label>
                    <input type="date" id="flight-date" required>
                </div>
                <button type="submit" class="submit-btn">Добавить</button>
            </form>
        </div>
        <div id="import-form" class="import-form" style="display: none;">
            <h3>Массовый импорт маршрутов</h3>
            <p class="import-hint">Формат CSV: авиалиния,рейс,откуда,куда,датавремя</p>
            <p class="import-example">Пример: Aeroflot,SU 123,SVO,LED,15.03.2024 14:30</p>
            <textarea id="csv-input" placeholder="Aeroflot,SU 123,SVO,LED,15.03.2024 14:30&#10;S7 Airlines,S7 456,DME,AYT,20.06.2024 10:00" rows="8"></textarea>
            <button onclick="importCSV()" class="submit-btn">Импортировать</button>
        </div>
    </div>
    
    <h2>📊 Статистика перелетов</h2>
    
    <h3>Фильтр по годам</h3>
    <button class="toggle-all" onclick="toggleAllYears()">Показать/Скрыть все</button>
    <div id="year-filters"></div>
    
    <div class="stats-section">
        <h3>Общая статистика</h3>
        <div id="overall-stats"></div>
    </div>
    
    <div id="year-stats"></div>
</div>

<div id="info-panel">
    <div id="flight-detail"></div>
</div>

<script src="airports.js"></script>
<script src="data.js"></script>
<script src="flights.js"></script>
<script src="app.js"></script>
</body>
</html>
